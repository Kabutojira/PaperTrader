[safety]
paper_trading_only = true
allow_real_orders = false

[paths]
data_dir = data
wiki_path = data/wiki
schemas_dir = schemas
skills_dir = skills

[market_data]
provider = yfinance
price_retention_days = 365
minimum_sma_200_observations = 200
stale_price_hours = 36
retrieval_retries = 3
timezone = UTC
display_timezone = Europe/Rome

[indicators]
rsi_period = 14
rsi_oversold = 30
rsi_overbought = 70
bollinger_period = 20
bollinger_standard_deviations = 2
sma_periods = 20,50,200
macd_fast = 12
macd_slow = 26
macd_signal = 9
volume_zscore_threshold = 2
opportunity_cooldown_days = 7
material_strengthening_pct = 20

[calendars]
XAMS = XAMS
XASX = XASX
XETR = XETR
XFRA = XFRA
XLON = XLON
XMIL = XMIL
XNAS = XNYS
XNYS = XNYS
XOTC = XNYS
XPAR = XPAR
XWBO = XWBO

[portfolio]
base_currency = EUR
initial_capital = 10000.00

[risk]
margin_of_safety_pct = 20
maximum_single_position_pct = 10
maximum_short_position_pct = 5
maximum_options_premium_risk_pct = 2
maximum_pair_gross_exposure_pct = 15
maximum_total_gross_exposure_pct = 100
maximum_active_strategies = 10
maximum_daily_turnover_pct = 20
allowed_instruments = equity,option
allowed_exchanges = XAMS,XASX,XETR,XFRA,XLON,XMIL,XNAS,XNYS,XOTC,XPAR,XWBO
allowed_currencies = AUD,EUR,GBP,USD
minimum_option_open_interest = 100
minimum_option_volume = 10

[allocation]
mode = active
target_invested_pct = 60
minimum_cash_reserve_pct = 25
maximum_baseline_sleeve_pct = 30
maximum_baseline_position_pct = 5
maximum_sector_pct = 20
maximum_theme_pct = 20
cash_hurdle_score = 60
minimum_base_upside_pct = 10
minimum_upside_downside_ratio = 1
minimum_confidence = medium
minimum_diversified_candidates = 6
maximum_assessment_age_days = 30
research_refresh_lead_days = 7
maximum_deployment_per_run_pct = 15
minimum_trade_pct = 1
rebalance_band_pct = 1

[orders]
default_fill_policy = next_open
default_order_type = market
slippage_model = fixed_bps
slippage_bps = 5
fee_model = fixed_plus_bps
fixed_fee = 1.00
variable_fee_bps = 1
option_quote_freshness_minutes = 15
order_expiry_hours = 24

[operations]
lease_minutes = 30
default_max_attempts = 3
maximum_llm_operations_per_run = 5
maximum_model_budget_usd_per_run = 5.00

[classifier]
command = python -m papertrader.classifier_command
model = gpt-5.6-luna
timeout_seconds = 120

[reviews]
idea_review_days = 30
security_review_days = 30
relationship_review_days = 30
strategy_review_days = 7

[wiki]
max_page_bytes = 100000
log_rotation_lines = 5000

[hermes]
wiki_path = data/wiki
skills_external_dirs = skills
require_native_skill = llm-wiki
native_skill_version = 2.1.0
command = hermes chat
arguments = --quiet --yolo
provider = openai-codex
model = gpt-5.6-sol
toolsets = web,file,terminal
inference_environment =
maximum_turns = 90
timeout_seconds = 1800

[telegram]
maximum_attempts = 3
timeout_seconds = 15
message_limit = 32768
