version: 1
dynamic_contracts:
  price_cache:
    glob: data/market/prices/*.csv
    columns:
      - date
      - open
      - high
      - low
      - close
      - adjusted_close
      - volume
      - dividends
      - stock_splits
      - currency
      - provider_symbol
      - retrieved_at
      - source
  fx_cache:
    glob: data/market/fx/*.csv
    columns:
      - date
      - currency
      - base_currency
      - rate_to_base
      - retrieved_at
      - source
contracts:
  securities:
    path: data/tables/securities.csv
    columns:
      - security_id
      - issuer_id
      - company_name
      - instrument_name
      - instrument_type
      - ticker
      - exchange_code
      - venue_mic
      - provider_symbol
      - broker_symbol
      - currency
      - country
      - sector
      - industry
      - status
      - watchlist_reason
      - research_summary
      - research_page
      - last_research_at
      - next_review_at
      - created_at
      - updated_at
      - source
  relationships:
    path: data/tables/relationships.csv
    columns:
      - relationship_id
      - idea_id
      - security_id
      - relationship_type
      - direction
      - mechanism
      - sensitivity
      - confidence
      - catalyst
      - invalidation
      - status
      - research_page
      - last_reviewed_at
      - next_review_at
      - created_at
      - updated_at
  strategies:
    path: data/tables/strategies.csv
    columns:
      - strategy_id
      - idea_id
      - security_id
      - relationship_id
      - name
      - status
      - direction
      - instrument_type
      - thesis
      - entry_rule
      - exit_rule
      - invalidation
      - risk_budget_pct
      - sleeve
      - allocation_plan_id
      - not_before
      - expires_at
      - research_page
      - created_at
      - updated_at
  security_assessments:
    path: data/tables/security_assessments.csv
    columns:
      - security_id
      - assessed_at
      - expires_at
      - eligibility
      - confidence
      - thesis_score
      - business_quality_score
      - balance_sheet_score
      - valuation_score
      - timing_score
      - liquidity_score
      - risk_penalty
      - downside_pct
      - base_upside_pct
      - valuation_horizon_months
      - hard_blockers
      - soft_gaps
      - evidence_refs
      - run_id
  allocation_targets:
    path: data/tables/allocation_targets.csv
    generated: true
    columns: &allocation_columns
      - allocation_plan_id
      - run_id
      - as_of
      - security_id
      - strategy_id
      - sleeve
      - rank
      - effective_score
      - candidate_edge
      - current_weight_pct
      - pending_weight_pct
      - target_weight_pct
      - target_value_base
      - delta_value_base
      - disposition
      - reason
      - assessment_as_of
  allocation_history:
    path: data/tables/allocation_history.csv
    append_only: true
    columns: *allocation_columns
  strategy_legs:
    path: data/tables/strategy_legs.csv
    columns:
      - strategy_id
      - leg_id
      - action
      - side
      - instrument_type
      - security_id
      - provider_contract_id
      - option_type
      - expiry
      - strike
      - quantity
      - contract_multiplier
      - order_type
      - limit_price
      - currency
  signals:
    path: data/tables/signals.csv
    columns:
      - signal_id
      - strategy_id
      - signal_type
      - created_at
      - expires_at
      - status
      - rationale
      - market_data_as_of
      - order_request_path
      - telegram_sent_at
      - run_id
  orders:
    path: data/tables/orders.csv
    columns:
      - order_id
      - signal_id
      - strategy_id
      - created_at
      - status
      - fill_policy
      - not_before
      - expires_at
      - order_type
      - limit_price
      - slippage_bps
      - fee_model
      - currency
      - run_id
  order_legs:
    path: data/tables/order_legs.csv
    columns:
      - order_id
      - leg_id
      - action
      - side
      - instrument_type
      - security_id
      - provider_contract_id
      - option_type
      - expiry
      - strike
      - quantity
      - contract_multiplier
      - limit_price
      - currency
  executions:
    path: data/tables/executions.csv
    append_only: true
    columns:
      - execution_id
      - order_id
      - leg_id
      - executed_at
      - security_id
      - provider_contract_id
      - side
      - quantity
      - fill_price
      - contract_multiplier
      - fees
      - currency
      - fx_rate_to_base
      - cash_effect
      - source_bar_time
      - run_id
  cash_ledger:
    path: data/tables/cash_ledger.csv
    append_only: true
    columns:
      - cash_entry_id
      - occurred_at
      - entry_type
      - reference_id
      - currency
      - amount
      - fx_rate_to_base
      - base_amount
      - run_id
      - notes
  corporate_actions:
    path: data/market/corporate_actions.csv
    append_only: true
    columns:
      - corporate_action_id
      - security_id
      - action_date
      - action_type
      - value
      - currency
      - source
      - source_price_hash
      - recorded_at
  portfolio:
    path: data/tables/portfolio.csv
    generated: true
    columns:
      - position_id
      - security_id
      - provider_contract_id
      - instrument_type
      - side
      - quantity
      - average_cost
      - currency
      - current_price
      - market_value_base
      - unrealized_pnl_base
      - realized_pnl_base
      - opened_at
      - last_mark_at
      - strategy_ids
  performance_epochs:
    path: data/tables/performance_epochs.csv
    append_only: true
    columns:
      - performance_epoch_id
      - started_at
      - opening_equity_base
      - base_currency
      - reason
      - run_id
  performance_daily:
