      - snapshot_id
      - as_of
      - signal_id
      - strategy_id
      - order_id
      - security_id
      - ticker
      - company_name
      - action
      - action_status
      - copy_ready
      - quantity
      - order_type
      - limit_price
      - currency
      - created_at
      - expires_at
      - market_data_as_of
      - current_weight_pct
