    generated: true
    columns:
      - date
      - performance_epoch_id
      - base_currency
      - cash_base
      - market_value_base
      - equity_base
      - gross_exposure_base
      - net_exposure_base
      - realized_pnl_base
      - unrealized_pnl_base
      - net_external_flow_base
