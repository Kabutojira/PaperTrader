[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "papertrader"
version = "0.1.0"
description = "Autonomous company research, discovery and valuation"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }
authors = [{ name = "PaperTrader contributors" }]
dependencies = [
  "exchange-calendars==4.13.2",
  "jsonschema==4.26.0",
  "numpy==2.5.4",
  "pandas==3.0.6",
  "PyYAML==6.0.3",
  "yfinance[repair]==1.7.0",
  "curl-cffi==0.16.3",
  "pypdf==6.21.1",
]

[project.scripts]
papertrader = "papertrader.research_cli:main"

[dependency-groups]
dev = [
  "mypy==2.3.1",
  "pytest==9.1.1",
  "ruff==0.16.9",
  "types-jsonschema==4.26.0.20260518",
  "types-PyYAML==6.0.12.20260906",
]

[tool.hatch.build.targets.wheel]
packages = ["src/papertrader"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "slow: full-cycle and property tests that CI runs but the daily runtime preflight skips",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
files = ["src"]
