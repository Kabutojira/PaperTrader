name: Schedule Seeking Alpha search-index discovery
description: Queue one bounded search-only discovery operation before agent credentials exist
inputs:
  run_id:
    description: Immutable PaperTrader run identity
    required: true
  enabled:
    description: Whether this caller enables Seeking Alpha lead discovery
    required: true
  dry_run:
    description: Validate configuration without changing the operation queue
    required: true
runs:
  using: composite
  steps:
    - name: Schedule bounded search-index discovery
      shell: bash
      env:
        PAPERTRADER_SEEKINGALPHA_DRY_RUN: ${{ inputs.dry_run }}
        PAPERTRADER_SEEKINGALPHA_ENABLED: ${{ inputs.enabled }}
        PAPERTRADER_SEEKINGALPHA_RUN_ID: ${{ inputs.run_id }}
      run: |
        set -euo pipefail
        if [ "$PAPERTRADER_SEEKINGALPHA_ENABLED" != "true" ]; then
          exit 0
        fi
        arguments=(seekingalpha schedule --run-id "$PAPERTRADER_SEEKINGALPHA_RUN_ID")
        if [ "$PAPERTRADER_SEEKINGALPHA_DRY_RUN" = "true" ]; then
          arguments+=(--dry-run)
        fi
        uv run papertrader "${arguments[@]}"
