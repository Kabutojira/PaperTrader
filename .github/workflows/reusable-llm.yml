          dry_run: ${{ inputs.dry_run }}
          github_token: ${{ !inputs.dry_run && github.token || '' }}
          openai_oauth_secret: ${{ secrets.OPENAI_OAUTH_SECRET }}
      - name: Routed research checkpoint 20
        id: operation_20
        if: ${{ fromJSON(inputs.max_operations) >= 20 && steps.operation_19.outputs.continue == 'true' }}
        uses: ./.github/actions/checkpoint-operation
        with:
          daily_cycle_id: ${{ steps.cycle.outputs.cycle_id }}
          hermes_home: ${{ env.HERMES_HOME }}
          operation_id: ${{ inputs.operation_id }}
          operation_type: ${{ inputs.operation_type }}
          target_branch: ${{ inputs.target_branch || github.event.repository.default_branch }}
          dry_run: ${{ inputs.dry_run }}
          github_token: ${{ !inputs.dry_run && github.token || '' }}
          openai_oauth_secret: ${{ secrets.OPENAI_OAUTH_SECRET }}
      - name: Finalize accounting, allocation, publication, and report
        id: finalization
        env:
          CYCLE_ID: ${{ steps.cycle.outputs.cycle_id }}
          TARGET_BRANCH: ${{ inputs.target_branch || github.event.repository.default_branch }}
          GENERATE_PODCAST: ${{ inputs.generate_podcast }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          report_name="daily-report_$(date -u +%Y%m%d).md"
          report_url="https://github.com/${GITHUB_REPOSITORY}/blob/${TARGET_BRANCH}/data/wiki/daily-reports/${report_name}"
          uv run papertrader daily finalize --run-id "$CYCLE_ID" --github-report-url "$report_url"
          if [ "$GENERATE_PODCAST" != "true" ] || [ "$DRY_RUN" = "true" ]; then
            uv run papertrader daily complete --daily-cycle-id "$CYCLE_ID"
          fi
          checkpoint=$(uv run papertrader daily record-checkpoint --daily-cycle-id "$CYCLE_ID" --kind finalization)
          echo "index=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["index"])' <<< "$checkpoint")" >> "$GITHUB_OUTPUT"
      - name: Run full post-finalization gate
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run pytest
          uv run papertrader schema validate --strict
          uv run papertrader integrity --strict
          uv run papertrader advice validate --strict
          uv run papertrader wiki lint --strict
          uv run papertrader portfolio reconcile --strict
      - name: Push finalization checkpoint from the credentialed boundary
        id: finalization_checkpoint
        env:
          GITHUB_TOKEN: ${{ !inputs.dry_run && github.token || '' }}
          CYCLE_ID: ${{ steps.cycle.outputs.cycle_id }}
          CHECKPOINT_INDEX: ${{ steps.finalization.outputs.index }}
          TARGET_BRANCH: ${{ inputs.target_branch || github.event.repository.default_branch }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          arguments=(workflow checkpoint --daily-cycle-id "$CYCLE_ID" --checkpoint-index "$CHECKPOINT_INDEX" --kind finalization --target-branch "$TARGET_BRANCH")
          if [ "$DRY_RUN" = "true" ]; then arguments+=(--dry-run); fi
          result=$(uv run papertrader "${arguments[@]}")
          echo "commit_sha=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["commit_sha"])' <<< "$result")" >> "$GITHUB_OUTPUT"
      - name: Freeze complete cycle podcast context and enqueue text synthesis
        id: podcast_enqueue
        if: ${{ inputs.generate_podcast && !inputs.dry_run }}
        env:
          CYCLE_ID: ${{ steps.cycle.outputs.cycle_id }}
        run: |
          cutoff=$(python3 -c 'import json,os,pathlib; print(json.loads((pathlib.Path("data/runs") / os.environ["CYCLE_ID"] / "daily_run.json").read_text())["research_cutoff_at"])')
          uv run papertrader podcast context build --daily-cycle-id "$CYCLE_ID" --cutoff "$cutoff"
          result=$(uv run papertrader podcast enqueue --run-id "$CYCLE_ID")
          echo "operation_id=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["operation_id"])' <<< "$result")" >> "$GITHUB_OUTPUT"
      - name: Synthesize only the timestamped podcast transcript
        if: ${{ inputs.generate_podcast && !inputs.dry_run }}
        continue-on-error: true
        env:
          CYCLE_ID: ${{ steps.cycle.outputs.cycle_id }}
          PODCAST_OPERATION_ID: ${{ steps.podcast_enqueue.outputs.operation_id }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: uv run papertrader agent run --hermes-home "$HERMES_HOME" --run-id "$CYCLE_ID" --operation-id "$PODCAST_OPERATION_ID" --operation-type daily_podcast
      - name: Encrypt a podcast-time OAuth refresh before its text checkpoint
        if: ${{ inputs.generate_podcast && !inputs.dry_run }}
        env:
          OPENAI_OAUTH_SECRET: ${{ secrets.OPENAI_OAUTH_SECRET }}
        run: |
          auth_before="$RUNNER_TEMP/openai-oauth-auth.before.json"
          auth_file="$HERMES_HOME/auth.json"
          if cmp -s "$auth_before" "$auth_file"; then exit 0; fi
          identity="$RUNNER_TEMP/podcast-oauth.agekey"
          refreshed="$RUNNER_TEMP/podcast-oauth.age"
          verified="$RUNNER_TEMP/podcast-oauth.verify.json"
          install -m 600 /dev/null "$identity"
          printf '%s\n' "$OPENAI_OAUTH_SECRET" > "$identity"
          recipient=$(age-keygen -y "$identity")
          age --encrypt --recipient "$recipient" --output "$refreshed" "$auth_file"
          age --decrypt --identity "$identity" --output "$verified" "$refreshed"
          cmp -s "$auth_file" "$verified"
          install -m 600 "$refreshed" .papertrader/credentials/openai-oauth-auth.json.age
          install -m 600 "$auth_file" "$auth_before"
          rm -f "$identity" "$refreshed" "$verified"
      - name: Finalize text podcast and reserve its checkpoint
        id: podcast_text
        if: ${{ inputs.generate_podcast && !inputs.dry_run }}
        env:
          CYCLE_ID: ${{ steps.cycle.outputs.cycle_id }}
          PODCAST_OPERATION_ID: ${{ steps.podcast_enqueue.outputs.operation_id }}
        run: |
          status=$(uv run papertrader podcast finalize --run-id "$CYCLE_ID")
          checkpoint=$(uv run papertrader daily record-checkpoint --daily-cycle-id "$CYCLE_ID" --kind podcast_text --operation-id "$PODCAST_OPERATION_ID" --operation-type daily_podcast --terminal-status "$status" --profile analyst)
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "index=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["index"])' <<< "$checkpoint")" >> "$GITHUB_OUTPUT"
      - name: Push the terminal text-podcast checkpoint
        id: podcast_checkpoint
        if: ${{ inputs.generate_podcast && !inputs.dry_run && steps.podcast_text.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CYCLE_ID: ${{ steps.cycle.outputs.cycle_id }}
          CHECKPOINT_INDEX: ${{ steps.podcast_text.outputs.index }}
          PODCAST_OPERATION_ID: ${{ steps.podcast_enqueue.outputs.operation_id }}
          TARGET_BRANCH: ${{ inputs.target_branch || github.event.repository.default_branch }}
        run: |
          result=$(uv run papertrader workflow checkpoint --daily-cycle-id "$CYCLE_ID" --checkpoint-index "$CHECKPOINT_INDEX" --kind podcast_text --operation-id "$PODCAST_OPERATION_ID" --operation-type daily_podcast --terminal-status "${{ steps.podcast_text.outputs.status }}" --profile analyst --target-branch "$TARGET_BRANCH")
          echo "commit_sha=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["commit_sha"])' <<< "$result")" >> "$GITHUB_OUTPUT"
      - name: Render audio ephemerally from the exact pushed transcript
        id: render_audio
        if: ${{ inputs.generate_podcast && !inputs.dry_run && steps.podcast_text.outputs.status == 'succeeded' && steps.podcast_checkpoint.outcome == 'success' }}
        continue-on-error: true
        env:
          CYCLE_ID: ${{ steps.cycle.outputs.cycle_id }}
          SCRIPT_COMMIT: ${{ steps.podcast_checkpoint.outputs.commit_sha }}
        run: |
          command -v edge-tts >/dev/null
          command -v ffmpeg >/dev/null
          command -v ffprobe >/dev/null
          stamp="${CYCLE_ID#daily-}"
          output_directory="$RUNNER_TEMP/papertrader-podcast/$CYCLE_ID"
          script_path="data/wiki/podcasts/daily-podcast_${stamp}.md"
          result=$(uv run papertrader podcast render --daily-cycle-id "$CYCLE_ID" --script-commit "$SCRIPT_COMMIT" --script-path "$script_path" --output-directory "$output_directory")
          echo "audio_path=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["audio_path"])' <<< "$result")" >> "$GITHUB_OUTPUT"
          echo "manifest_path=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["manifest_path"])' <<< "$result")" >> "$GITHUB_OUTPUT"
          echo "script_path=$script_path" >> "$GITHUB_OUTPUT"
      - name: Upload one-day ephemeral podcast audio handoff
        if: ${{ steps.render_audio.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: papertrader-podcast-${{ steps.cycle.outputs.cycle_id }}
          path: |
            ${{ steps.render_audio.outputs.audio_path }}
            ${{ steps.render_audio.outputs.manifest_path }}
          if-no-files-found: error
          retention-days: 1
      - name: Publish cycle outputs
        id: outputs
        if: ${{ always() }}
        env:
          CYCLE_ID: ${{ steps.cycle.outputs.cycle_id }}
          FINALIZATION_SHA: ${{ steps.finalization_checkpoint.outputs.commit_sha }}
          PODCAST_SHA: ${{ steps.podcast_checkpoint.outputs.commit_sha }}
          PODCAST_STATUS: ${{ steps.podcast_text.outputs.status }}
          AUDIO_PATH: ${{ steps.render_audio.outputs.audio_path }}
          AUDIO_MANIFEST_PATH: ${{ steps.render_audio.outputs.manifest_path }}
          AUDIO_RENDER_OUTCOME: ${{ steps.render_audio.outcome }}
        run: |
          manifest="data/runs/$CYCLE_ID/daily_run.json"
          if [ -z "$CYCLE_ID" ] || [ ! -f "$manifest" ]; then
            echo "commit_sha=" >> "$GITHUB_OUTPUT"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "oauth_changed=false" >> "$GITHUB_OUTPUT"
            echo "report_path=" >> "$GITHUB_OUTPUT"
            echo "podcast_status=skipped" >> "$GITHUB_OUTPUT"
            echo "podcast_path=" >> "$GITHUB_OUTPUT"
            echo "audio_artifact_name=" >> "$GITHUB_OUTPUT"
            echo "audio_render_status=skipped" >> "$GITHUB_OUTPUT"
            echo "audio_path=" >> "$GITHUB_OUTPUT"
            echo "audio_manifest_path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          report_path=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["report_path"])' "$manifest")
          podcast_path=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["podcast_page_path"])' "$manifest")
          echo "commit_sha=${PODCAST_SHA:-$FINALIZATION_SHA}" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "oauth_changed=false" >> "$GITHUB_OUTPUT"
          echo "report_path=$report_path" >> "$GITHUB_OUTPUT"
          echo "podcast_status=${PODCAST_STATUS:-skipped}" >> "$GITHUB_OUTPUT"
          echo "podcast_path=$podcast_path" >> "$GITHUB_OUTPUT"
          if [ "$AUDIO_RENDER_OUTCOME" = "success" ]; then
            echo "audio_artifact_name=papertrader-podcast-$CYCLE_ID" >> "$GITHUB_OUTPUT"
            echo "audio_render_status=succeeded" >> "$GITHUB_OUTPUT"
          elif [ "$AUDIO_RENDER_OUTCOME" = "failure" ]; then
            echo "audio_artifact_name=" >> "$GITHUB_OUTPUT"
            echo "audio_render_status=failed" >> "$GITHUB_OUTPUT"
          else
            echo "audio_artifact_name=" >> "$GITHUB_OUTPUT"
            echo "audio_render_status=skipped" >> "$GITHUB_OUTPUT"
          fi
          echo "audio_path=$(basename "$AUDIO_PATH")" >> "$GITHUB_OUTPUT"
          echo "audio_manifest_path=$(basename "$AUDIO_MANIFEST_PATH")" >> "$GITHUB_OUTPUT"
      - name: Remove plaintext OAuth and all temporary media
        if: ${{ always() }}
        run: |
          rm -f "$HERMES_HOME/auth.json" "$RUNNER_TEMP/openai-oauth-auth.before.json" "$RUNNER_TEMP/papertrader-checkpoint.agekey" "$RUNNER_TEMP/openai-oauth-auth.refreshed.age" "$RUNNER_TEMP/openai-oauth-auth.verified.json"
          rm -rf "$RUNNER_TEMP/papertrader-podcast"
