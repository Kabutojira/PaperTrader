      - name: Routed research checkpoint 12
        id: operation_12
        if: ${{ steps.cycle.outputs.needs_finalization == 'true' && fromJSON(inputs.max_operations) >= 12 && steps.operation_11.outputs.continue == 'true' }}
        uses: ./.github/actions/checkpoint-operation
        with:
          daily_cycle_id: ${{ steps.cycle.outputs.cycle_id }}
