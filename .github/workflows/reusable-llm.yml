name: Reusable sequential PaperTrader runtime

on:
  workflow_call:
    inputs:
      operation_id:
        description: Optional immutable operation ID
        required: false
        default: ""
        type: string
      operation_type:
        description: Optional supported operation type
        required: false
        default: ""
        type: string
      max_operations:
        description: Maximum operations executed sequentially
        required: false
        default: "1"
        type: string
      dry_run:
        description: Exercise the runtime without inference, commit, or push
        required: false
        default: true
        type: boolean
      target_branch:
        description: Default branch receiving a validated runtime commit
        required: false
        default: ""
        type: string
      trigger:
        description: Machine-readable run trigger
        required: false
        default: workflow_dispatch
        type: string
      serialized_by_caller:
        description: Caller already holds the papertrader-write concurrency group
        required: false
        default: false
        type: boolean
    secrets:
      OPENAI_OAUTH_SECRET:
        description: age private identity used only by runtime credential steps
        required: false
    outputs:
      commit_sha:
        description: Validated runtime commit, or the unchanged base SHA
        value: ${{ jobs.commit.outputs.commit_sha }}
      changed:
        description: Whether the runtime patch contained repository changes
        value: ${{ jobs.commit.outputs.changed }}
      report_path:
        description: Canonical daily report path
        value: ${{ jobs.commit.outputs.report_path }}
      run_id:
        description: Immutable workflow run ID
        value: ${{ jobs.runtime.outputs.run_id }}
      oauth_changed:
        description: Whether refreshed encrypted OpenAI OAuth state was committed
        value: ${{ jobs.commit.outputs.oauth_changed }}
  workflow_dispatch:
    inputs:
      operation_id:
        description: Optional immutable operation ID
        required: false
        default: ""
        type: string
      operation_type:
        description: Optional supported operation type
        required: false
        default: ""
        type: string
      max_operations:
        description: Maximum operations executed sequentially
        required: false
        default: "1"
        type: string
      dry_run:
        description: Exercise the runtime without inference, commit, or push
        required: false
        default: true
        type: boolean
      target_branch:
        description: Branch receiving a validated runtime commit
        required: false
        default: ""
        type: string
      trigger:
        description: Machine-readable run trigger
        required: false
        default: workflow_dispatch
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ inputs.serialized_by_caller && format('papertrader-runtime-{0}', github.run_id) || 'papertrader-write' }}
  cancel-in-progress: false

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    container:
      image: nousresearch/hermes-agent@sha256:a6ce64e2038867885c2c90f6602425e6e70293d5e6d952a0e603a99265e01c40
      options: --user 0:0
    defaults:
      run:
        shell: bash
    env:
      HERMES_HOME: /tmp/papertrader-hermes
      PAPER_TRADING_ONLY: "true"
    outputs:
      artifact_name: ${{ steps.identities.outputs.artifact_name }}
      base_sha: ${{ steps.identities.outputs.base_sha }}
      oauth_artifact_name: ${{ steps.identities.outputs.oauth_artifact_name }}
      oauth_changed: ${{ steps.oauth.outputs.changed || 'false' }}
      oauth_sha256: ${{ steps.oauth.outputs.sha256 }}
      report_path: ${{ steps.bundle.outputs.report_path }}
      run_id: ${{ steps.identities.outputs.run_id }}
    steps:
      - name: Check out the target branch without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.target_branch || github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Establish the container workspace boundary
        run: |
          workspace="$(pwd -P)"
          git config --system --add safe.directory "$workspace"
          echo "WIKI_PATH=${workspace}/data/wiki" >> "$GITHUB_ENV"
      - name: Install pinned project runner
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.8.17"
          enable-cache: "false"
          github-token: ""
      - name: Install locked Python dependencies
        run: uv sync --locked --all-groups
      - name: Establish immutable runtime identities
        id: identities
        run: |
          base_sha="$(git rev-parse --verify 'HEAD^{commit}')"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "run_id=gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=papertrader-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "oauth_artifact_name=papertrader-oauth-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Determine whether OAuth restoration is required
        id: oauth_contract
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          MAX_OPERATIONS: ${{ inputs.max_operations }}
        run: |
          case "$MAX_OPERATIONS" in
            ""|*[!0-9]*)
              echo "::error::max_operations must be a non-negative integer"
              exit 1
              ;;
          esac
          oauth_required=false
          if [ "$DRY_RUN" != "true" ]; then
            oauth_required=true
          fi
          echo "oauth_required=$oauth_required" >> "$GITHUB_OUTPUT"
      - name: Configure an isolated Hermes profile
        run: >-
          uv run papertrader agent configure
          --hermes-home "$HERMES_HOME"
          --replace-unmanaged
      - name: Install checksum-verified age 1.3.1
        if: ${{ steps.oauth_contract.outputs.oauth_required == 'true' }}
        run: |
          age_archive="$RUNNER_TEMP/age-v1.3.1-linux-amd64.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$age_archive" \
            "https://github.com/FiloSottile/age/releases/download/v1.3.1/age-v1.3.1-linux-amd64.tar.gz"
          echo "bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377  $age_archive" \
            | sha256sum --check --status
          tar --extract --gzip --file "$age_archive" --directory "$RUNNER_TEMP"
          install -m 755 "$RUNNER_TEMP/age/age" /usr/local/bin/age
          install -m 755 "$RUNNER_TEMP/age/age-keygen" /usr/local/bin/age-keygen
          test "$(age --version)" = "v1.3.1"
          test "$(age-keygen --version)" = "v1.3.1"
      - name: Restore encrypted OpenAI OAuth state
        id: restore_oauth
        if: ${{ steps.oauth_contract.outputs.oauth_required == 'true' }}
        env:
          OPENAI_OAUTH_SECRET: ${{ secrets.OPENAI_OAUTH_SECRET }}
        run: |
          set -euo pipefail
          CIPHERTEXT="$GITHUB_WORKSPACE/.papertrader/credentials/openai-oauth-auth.json.age"
          IDENTITY_FILE="$RUNNER_TEMP/openai-oauth.agekey"
          AUTH_FILE="$HERMES_HOME/auth.json"
          AUTH_BEFORE="$RUNNER_TEMP/openai-oauth-auth.before.json"

          if ! test -s "$CIPHERTEXT"; then
            echo "::error::Missing .papertrader/credentials/openai-oauth-auth.json.age"
            exit 1
          fi
          if ! test -n "${OPENAI_OAUTH_SECRET:-}"; then
            echo "::error::OPENAI_OAUTH_SECRET is required for non-dry openai-codex inference"
            exit 1
          fi

          install -m 600 /dev/null "$IDENTITY_FILE"
          printf '%s\n' "$OPENAI_OAUTH_SECRET" > "$IDENTITY_FILE"

          age --decrypt \
            --identity "$IDENTITY_FILE" \
            --output "$AUTH_FILE" \
            "$CIPHERTEXT"

          chmod 600 "$AUTH_FILE"
          python3 -c 'import json,sys; value=json.load(open(sys.argv[1], encoding="utf-8")); assert isinstance(value, dict)' "$AUTH_FILE"
          cp "$AUTH_FILE" "$AUTH_BEFORE"
          chmod 600 "$AUTH_BEFORE"
      - name: Hand the isolated profile to the Hermes user
        run: chown -R hermes:hermes "$HERMES_HOME"
      - name: Synchronize bundled native skills into the isolated profile
        run: hermes skills opt-in --sync
      - name: Preflight OpenAI Codex OAuth without exposing credential state
        if: ${{ steps.oauth_contract.outputs.oauth_required == 'true' }}
        run: |
          set -euo pipefail
          if ! oauth_status="$(hermes auth status openai-codex 2>/dev/null)"; then
            echo "::error::Hermes could not inspect the restored openai-codex OAuth credential"
            exit 1
          fi
          oauth_status_line="${oauth_status%%$'\n'*}"
          unset oauth_status
          if [ "$oauth_status_line" != "openai-codex: logged in" ]; then
            echo "::error::Restored auth.json contains no usable openai-codex OAuth credential; re-authenticate and replace the ciphertext"
            exit 1
          fi
          unset oauth_status_line
      - name: Preflight native llm-wiki and the selected project skill
        env:
          OPERATION_TYPE: ${{ inputs.operation_type }}
        run: |
          selected_type="${OPERATION_TYPE:-wiki_ingest}"
          uv run papertrader agent preflight \
            --hermes-home "$HERMES_HOME" \
            --operation-type "$selected_type"
      - name: Prepare deterministic market, indicators, actions, and queue state
        env:
          BASE_SHA: ${{ steps.identities.outputs.base_sha }}
          DRY_RUN: ${{ inputs.dry_run }}
          RUN_ID: ${{ steps.identities.outputs.run_id }}
          RUN_TRIGGER: ${{ inputs.trigger }}
        run: |
          arguments=(daily prepare --run-id "$RUN_ID" --trigger "$RUN_TRIGGER" --source-sha "$BASE_SHA")
          if [ "$DRY_RUN" = "true" ]; then
            arguments+=(--offline --skip-classifier)
          fi
          uv run papertrader "${arguments[@]}"
      - name: Execute due Hermes operations strictly one at a time
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          MAX_OPERATIONS: ${{ inputs.max_operations }}
          OPERATION_ID: ${{ inputs.operation_id }}
          OPERATION_TYPE: ${{ inputs.operation_type }}
          RUN_ID: ${{ steps.identities.outputs.run_id }}
        run: |
          selected_max="$MAX_OPERATIONS"
          if [ "$DRY_RUN" = "true" ]; then
            selected_max=0
          fi
          arguments=(agent run-batch --hermes-home "$HERMES_HOME" --run-id "$RUN_ID" --max-operations "$selected_max")
          if [ -n "$OPERATION_ID" ]; then
            arguments+=(--operation-id "$OPERATION_ID")
          fi
          if [ -n "$OPERATION_TYPE" ]; then
            arguments+=(--operation-type "$OPERATION_TYPE")
          fi
          uv run papertrader "${arguments[@]}"
      - name: Finalize fills, portfolio, performance, and canonical report
        env:
          RUN_ID: ${{ steps.identities.outputs.run_id }}
          TARGET_BRANCH: ${{ inputs.target_branch || github.event.repository.default_branch }}
        run: |
          report_name="daily-report_$(date -u +%Y%m%d).md"
          report_url="https://github.com/${GITHUB_REPOSITORY}/blob/${TARGET_BRANCH}/data/wiki/daily-reports/${report_name}"
          uv run papertrader daily finalize --run-id "$RUN_ID" --github-report-url "$report_url"
      - name: Run the complete runtime validation gate
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run pytest
          uv run papertrader integrity --strict
          uv run papertrader wiki lint --strict
          uv run papertrader portfolio reconcile --strict
      - name: Create the whitelisted runtime patch bundle
        id: bundle
        env:
          BASE_SHA: ${{ steps.identities.outputs.base_sha }}
          RUN_ID: ${{ steps.identities.outputs.run_id }}
        run: |
          bundle_dir="${RUNNER_TEMP}/papertrader-runtime-bundle"
          uv run papertrader workflow bundle create \
            --output-directory "$bundle_dir" \
            --run-id "$RUN_ID" \
            --base-sha "$BASE_SHA"
          report_path=$(python3 -c 'import json, os, pathlib; print(json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "papertrader-runtime-bundle" / "runtime_manifest.json").read_text())["report_path"])')
          echo "report_path=$report_path" >> "$GITHUB_OUTPUT"
      - name: Upload the hash-verified runtime bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.identities.outputs.artifact_name }}
          path: ${{ runner.temp }}/papertrader-runtime-bundle
          if-no-files-found: error
          retention-days: 1
      - name: Encrypt refreshed OpenAI OAuth state when changed
        id: oauth
        if: ${{ always() && steps.oauth_contract.outputs.oauth_required == 'true' && steps.restore_oauth.outcome == 'success' }}
        run: |
          set -euo pipefail
          IDENTITY_FILE="$RUNNER_TEMP/openai-oauth.agekey"
          AUTH_FILE="$HERMES_HOME/auth.json"
          AUTH_BEFORE="$RUNNER_TEMP/openai-oauth-auth.before.json"
          AUTH_VERIFY="$RUNNER_TEMP/openai-oauth-auth.verify.json"
          REFRESHED_CIPHERTEXT="$RUNNER_TEMP/openai-oauth-auth.json.age"
          ARTIFACT_ROOT="$RUNNER_TEMP/papertrader-oauth-artifact"
          ARTIFACT_FILE="$ARTIFACT_ROOT/.papertrader/credentials/openai-oauth-auth.json.age"

          test -s "$IDENTITY_FILE"
          test -s "$AUTH_BEFORE"
          test -s "$AUTH_FILE"
          python3 -c 'import json,sys; value=json.load(open(sys.argv[1], encoding="utf-8")); assert isinstance(value, dict)' "$AUTH_FILE"
          if cmp -s "$AUTH_BEFORE" "$AUTH_FILE"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          AGE_RECIPIENT="$(age-keygen -y "$IDENTITY_FILE")"
          test -n "$AGE_RECIPIENT"
          age --encrypt \
            --recipient "$AGE_RECIPIENT" \
            --output "$REFRESHED_CIPHERTEXT" \
            "$AUTH_FILE"
          age --decrypt \
            --identity "$IDENTITY_FILE" \
            --output "$AUTH_VERIFY" \
            "$REFRESHED_CIPHERTEXT"
          cmp -s "$AUTH_FILE" "$AUTH_VERIFY"
          test -s "$REFRESHED_CIPHERTEXT"

          mkdir -p "$(dirname "$ARTIFACT_FILE")"
          install -m 600 "$REFRESHED_CIPHERTEXT" "$ARTIFACT_FILE"
          ciphertext_sha256="$(sha256sum "$REFRESHED_CIPHERTEXT" | cut -d ' ' -f 1)"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha256=$ciphertext_sha256" >> "$GITHUB_OUTPUT"
      - name: Upload only the refreshed OAuth ciphertext
        if: ${{ always() && steps.oauth.outputs.changed == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.identities.outputs.oauth_artifact_name }}
          path: ${{ runner.temp }}/papertrader-oauth-artifact
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
      - name: Remove all plaintext OAuth credential material
        if: ${{ always() }}
        run: |
          rm -f \
            "$HERMES_HOME/auth.json" \
            "$RUNNER_TEMP/openai-oauth.agekey" \
            "$RUNNER_TEMP/openai-oauth-auth.before.json" \
            "$RUNNER_TEMP/openai-oauth-auth.verify.json" \
            "$RUNNER_TEMP/openai-oauth-auth.json.age"
          rm -rf "$RUNNER_TEMP/papertrader-oauth-artifact"

  commit:
    needs: runtime
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      PAPER_TRADING_ONLY: "true"
      WIKI_PATH: ${{ github.workspace }}/data/wiki
    outputs:
      changed: ${{ steps.outcome.outputs.changed }}
      commit_sha: ${{ steps.outcome.outputs.commit_sha }}
      oauth_changed: ${{ steps.outcome.outputs.oauth_changed }}
      report_path: ${{ needs.runtime.outputs.report_path }}
    steps:
      - name: Check out the exact runtime base without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.runtime.outputs.base_sha || inputs.target_branch || github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned project runner
        run: python3 -m pip install --disable-pip-version-check uv==0.8.17
      - name: Install locked Python dependencies
        run: uv sync --locked --all-groups
      - name: Download the runtime bundle with artifact digest verification
        if: ${{ needs.runtime.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.runtime.outputs.artifact_name }}
          path: ${{ runner.temp }}/papertrader-runtime-bundle
      - name: Apply the exact validated runtime patch
        if: ${{ needs.runtime.result == 'success' }}
        run: >-
          uv run papertrader workflow bundle apply
          --bundle-directory "${RUNNER_TEMP}/papertrader-runtime-bundle"
      - name: Download the refreshed OAuth ciphertext with artifact digest verification
        if: ${{ needs.runtime.outputs.oauth_changed == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.runtime.outputs.oauth_artifact_name }}
          path: ${{ runner.temp }}/papertrader-oauth-artifact
      - name: Validate and stage only the refreshed OAuth ciphertext
        if: ${{ needs.runtime.outputs.oauth_changed == 'true' }}
        env:
          OAUTH_SHA256: ${{ needs.runtime.outputs.oauth_sha256 }}
        run: |
          uv run papertrader workflow oauth-artifact apply \
            --artifact-directory "$RUNNER_TEMP/papertrader-oauth-artifact" \
            --expected-sha256 "$OAUTH_SHA256"
          test ! -e "$RUNNER_TEMP/papertrader-oauth-artifact/auth.json"
          test ! -e ".papertrader/credentials/auth.json"
          git add -- .papertrader/credentials/openai-oauth-auth.json.age
      - name: Re-run validation in the commit boundary
        if: ${{ needs.runtime.result == 'success' }}
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run pytest
          uv run papertrader integrity --strict
          uv run papertrader wiki lint --strict
          uv run papertrader portfolio reconcile --strict
          uv run papertrader runtime-whitelist validate --staged
      - name: Validate credential-only staging after a runtime failure
        if: ${{ needs.runtime.result != 'success' && needs.runtime.outputs.oauth_changed == 'true' }}
        run: |
          staged_paths="$(git diff --cached --name-only --diff-filter=ACDMRTUXB)"
          test "$staged_paths" = ".papertrader/credentials/openai-oauth-auth.json.age"
          uv run papertrader runtime-whitelist validate --staged
      - name: Create a commit only when validated state changed
        id: commit
        if: ${{ !inputs.dry_run && (needs.runtime.result == 'success' || needs.runtime.outputs.oauth_changed == 'true') }}
        env:
          RUN_ID: ${{ needs.runtime.outputs.run_id }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
        run: |
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "papertrader-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$RUNTIME_RESULT" = "success" ]; then
            git commit -m "chore(runtime): publish daily run ${RUN_ID}"
          else
            git commit -m "chore(auth): persist refreshed OpenAI OAuth state"
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Rebase the validated commit
        id: rebase
        if: ${{ !inputs.dry_run && steps.commit.outputs.changed == 'true' }}
        env:
          TARGET_BRANCH: ${{ inputs.target_branch || github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "$TARGET_BRANCH"
          git rebase "origin/${TARGET_BRANCH}"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Repeat strict validation after a successful runtime rebase
        if: ${{ !inputs.dry_run && steps.commit.outputs.changed == 'true' && needs.runtime.result == 'success' }}
        env:
          TARGET_BRANCH: ${{ inputs.target_branch || github.event.repository.default_branch }}
        run: |
          uv run papertrader integrity --strict
          uv run papertrader wiki lint --strict
          uv run papertrader portfolio reconcile --strict
          uv run papertrader runtime-whitelist validate \
            --base-ref "origin/${TARGET_BRANCH}" \
            --head-ref HEAD
      - name: Repeat credential-only validation after a failed runtime rebase
        if: ${{ !inputs.dry_run && steps.commit.outputs.changed == 'true' && needs.runtime.result != 'success' }}
        env:
          TARGET_BRANCH: ${{ inputs.target_branch || github.event.repository.default_branch }}
        run: |
          changed_paths="$(git diff --name-only --diff-filter=ACDMRTUXB "origin/${TARGET_BRANCH}..HEAD")"
          test "$changed_paths" = ".papertrader/credentials/openai-oauth-auth.json.age"
          uv run papertrader runtime-whitelist validate \
            --base-ref "origin/${TARGET_BRANCH}" \
            --head-ref HEAD
      - name: Push only from the post-agent credentialed boundary
        if: ${{ !inputs.dry_run && steps.commit.outputs.changed == 'true' }}
        env:
          PAPERTRADER_GIT_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ inputs.target_branch || github.event.repository.default_branch }}
        run: |
          git config --local credential.helper '!f() { if test "$1" = get; then echo username=x-access-token; echo "password=$PAPERTRADER_GIT_TOKEN"; fi; }; f'
          git push "https://github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${TARGET_BRANCH}"
          git config --local --unset-all credential.helper
      - name: Publish commit outputs
        id: outcome
        env:
          BASE_SHA: ${{ needs.runtime.outputs.base_sha }}
          COMMIT_SHA: ${{ steps.commit.outputs.commit_sha }}
          DRY_RUN: ${{ inputs.dry_run }}
          REBASED_SHA: ${{ steps.rebase.outputs.commit_sha }}
          RUNTIME_CHANGED: ${{ steps.commit.outputs.changed }}
          OAUTH_CHANGED: ${{ needs.runtime.outputs.oauth_changed }}
        run: |
          base_sha="${BASE_SHA:-$(git rev-parse HEAD)}"
          if [ "$DRY_RUN" = "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "commit_sha=$base_sha" >> "$GITHUB_OUTPUT"
            echo "oauth_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=${RUNTIME_CHANGED:-false}" >> "$GITHUB_OUTPUT"
            echo "commit_sha=${REBASED_SHA:-${COMMIT_SHA:-$base_sha}}" >> "$GITHUB_OUTPUT"
            echo "oauth_changed=${OAUTH_CHANGED:-false}" >> "$GITHUB_OUTPUT"
          fi
