          dry_run: ${{ inputs.dry_run }}
          github_token: ${{ !inputs.dry_run && github.token || '' }}
          openai_oauth_secret: ${{ secrets.OPENAI_OAUTH_SECRET }}
      - name: Routed research checkpoint 13
        id: operation_13
        if: ${{ steps.cycle.outputs.needs_finalization == 'true' && fromJSON(inputs.max_operations) >= 13 && steps.operation_12.outputs.continue == 'true' }}
        uses: ./.github/actions/checkpoint-operation
        with:
          daily_cycle_id: ${{ steps.cycle.outputs.cycle_id }}
          hermes_home: ${{ env.HERMES_HOME }}
          operation_id: ${{ inputs.operation_id }}
          operation_type: ${{ inputs.operation_type }}
          target_branch: ${{ inputs.target_branch || github.event.repository.default_branch }}
          dry_run: ${{ inputs.dry_run }}
          github_token: ${{ !inputs.dry_run && github.token || '' }}
          openai_oauth_secret: ${{ secrets.OPENAI_OAUTH_SECRET }}
      - name: Routed research checkpoint 14
        id: operation_14
        if: ${{ steps.cycle.outputs.needs_finalization == 'true' && fromJSON(inputs.max_operations) >= 14 && steps.operation_13.outputs.continue == 'true' }}
        uses: ./.github/actions/checkpoint-operation
        with:
          daily_cycle_id: ${{ steps.cycle.outputs.cycle_id }}
          hermes_home: ${{ env.HERMES_HOME }}
          operation_id: ${{ inputs.operation_id }}
          operation_type: ${{ inputs.operation_type }}
          target_branch: ${{ inputs.target_branch || github.event.repository.default_branch }}
          dry_run: ${{ inputs.dry_run }}
          github_token: ${{ !inputs.dry_run && github.token || '' }}
          openai_oauth_secret: ${{ secrets.OPENAI_OAUTH_SECRET }}
      - name: Routed research checkpoint 15
        id: operation_15
        if: ${{ steps.cycle.outputs.needs_finalization == 'true' && fromJSON(inputs.max_operations) >= 15 && steps.operation_14.outputs.continue == 'true' }}
        uses: ./.github/actions/checkpoint-operation
        with:
          daily_cycle_id: ${{ steps.cycle.outputs.cycle_id }}
          hermes_home: ${{ env.HERMES_HOME }}
          operation_id: ${{ inputs.operation_id }}
          operation_type: ${{ inputs.operation_type }}
          target_branch: ${{ inputs.target_branch || github.event.repository.default_branch }}
          dry_run: ${{ inputs.dry_run }}
          github_token: ${{ !inputs.dry_run && github.token || '' }}
          openai_oauth_secret: ${{ secrets.OPENAI_OAUTH_SECRET }}
      - name: Routed research checkpoint 16
        id: operation_16
        if: ${{ steps.cycle.outputs.needs_finalization == 'true' && fromJSON(inputs.max_operations) >= 16 && steps.operation_15.outputs.continue == 'true' }}
        uses: ./.github/actions/checkpoint-operation
        with:
          daily_cycle_id: ${{ steps.cycle.outputs.cycle_id }}
          hermes_home: ${{ env.HERMES_HOME }}
          operation_id: ${{ inputs.operation_id }}
          operation_type: ${{ inputs.operation_type }}
          target_branch: ${{ inputs.target_branch || github.event.repository.default_branch }}
          dry_run: ${{ inputs.dry_run }}
          github_token: ${{ !inputs.dry_run && github.token || '' }}
          openai_oauth_secret: ${{ secrets.OPENAI_OAUTH_SECRET }}
      - name: Routed research checkpoint 17
        id: operation_17
        if: ${{ steps.cycle.outputs.needs_finalization == 'true' && fromJSON(inputs.max_operations) >= 17 && steps.operation_16.outputs.continue == 'true' }}
        uses: ./.github/actions/checkpoint-operation
        with:
          daily_cycle_id: ${{ steps.cycle.outputs.cycle_id }}
          hermes_home: ${{ env.HERMES_HOME }}
          operation_id: ${{ inputs.operation_id }}
          operation_type: ${{ inputs.operation_type }}
          target_branch: ${{ inputs.target_branch || github.event.repository.default_branch }}
          dry_run: ${{ inputs.dry_run }}
          github_token: ${{ !inputs.dry_run && github.token || '' }}
          openai_oauth_secret: ${{ secrets.OPENAI_OAUTH_SECRET }}
      - name: Routed research checkpoint 18
        id: operation_18
        if: ${{ steps.cycle.outputs.needs_finalization == 'true' && fromJSON(inputs.max_operations) >= 18 && steps.operation_17.outputs.continue == 'true' }}
        uses: ./.github/actions/checkpoint-operation
        with:
          daily_cycle_id: ${{ steps.cycle.outputs.cycle_id }}
          hermes_home: ${{ env.HERMES_HOME }}
          operation_id: ${{ inputs.operation_id }}
          operation_type: ${{ inputs.operation_type }}
          target_branch: ${{ inputs.target_branch || github.event.repository.default_branch }}
          dry_run: ${{ inputs.dry_run }}
          github_token: ${{ !inputs.dry_run && github.token || '' }}
          openai_oauth_secret: ${{ secrets.OPENAI_OAUTH_SECRET }}
      - name: Routed research checkpoint 19
        id: operation_19
        if: ${{ steps.cycle.outputs.needs_finalization == 'true' && fromJSON(inputs.max_operations) >= 19 && steps.operation_18.outputs.continue == 'true' }}
        uses: ./.github/actions/checkpoint-operation
        with:
          daily_cycle_id: ${{ steps.cycle.outputs.cycle_id }}
          hermes_home: ${{ env.HERMES_HOME }}
          operation_id: ${{ inputs.operation_id }}
          operation_type: ${{ inputs.operation_type }}
          target_branch: ${{ inputs.target_branch || github.event.repository.default_branch }}
          dry_run: ${{ inputs.dry_run }}
          github_token: ${{ !inputs.dry_run && github.token || '' }}
          openai_oauth_secret: ${{ secrets.OPENAI_OAUTH_SECRET }}
      - name: Routed research checkpoint 20
        id: operation_20
        if: ${{ steps.cycle.outputs.needs_finalization == 'true' && fromJSON(inputs.max_operations) >= 20 && steps.operation_19.outputs.continue == 'true' }}
        uses: ./.github/actions/checkpoint-operation
        with:
          daily_cycle_id: ${{ steps.cycle.outputs.cycle_id }}
          hermes_home: ${{ env.HERMES_HOME }}
          operation_id: ${{ inputs.operation_id }}
          operation_type: ${{ inputs.operation_type }}
          target_branch: ${{ inputs.target_branch || github.event.repository.default_branch }}
          dry_run: ${{ inputs.dry_run }}
          github_token: ${{ !inputs.dry_run && github.token || '' }}
          openai_oauth_secret: ${{ secrets.OPENAI_OAUTH_SECRET }}
      - name: Finalize accounting, allocation, publication, and report
        id: finalization
        if: ${{ steps.cycle.outputs.needs_finalization == 'true' }}
        env:
          CYCLE_ID: ${{ steps.cycle.outputs.cycle_id }}
          TARGET_BRANCH: ${{ inputs.target_branch || github.event.repository.default_branch }}
          GENERATE_PODCAST: ${{ inputs.generate_podcast }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          report_name="daily-report_$(date -u +%Y%m%d).md"
          report_url="https://github.com/${GITHUB_REPOSITORY}/blob/${TARGET_BRANCH}/data/wiki/daily-reports/${report_name}"
          uv run papertrader daily finalize --run-id "$CYCLE_ID" --github-report-url "$report_url"
          if [ "$GENERATE_PODCAST" != "true" ] || [ "$DRY_RUN" = "true" ]; then
            uv run papertrader daily complete --daily-cycle-id "$CYCLE_ID"
          fi
          checkpoint=$(uv run papertrader daily record-checkpoint --daily-cycle-id "$CYCLE_ID" --kind finalization)
          echo "index=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["index"])' <<< "$checkpoint")" >> "$GITHUB_OUTPUT"
      - name: Run full post-finalization gate
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run pytest
          uv run papertrader schema validate --strict
          uv run papertrader integrity --strict
          uv run papertrader advice validate --strict
          uv run papertrader wiki lint --strict
          uv run papertrader portfolio reconcile --strict
      - name: Push finalization checkpoint from the credentialed boundary
        id: finalization_checkpoint
        if: ${{ steps.cycle.outputs.needs_finalization == 'true' }}
        env:
          GITHUB_TOKEN: ${{ !inputs.dry_run && github.token || '' }}
          CYCLE_ID: ${{ steps.cycle.outputs.cycle_id }}
          CHECKPOINT_INDEX: ${{ steps.finalization.outputs.index }}
          TARGET_BRANCH: ${{ inputs.target_branch || github.event.repository.default_branch }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          arguments=(workflow checkpoint --daily-cycle-id "$CYCLE_ID" --checkpoint-index "$CHECKPOINT_INDEX" --kind finalization --target-branch "$TARGET_BRANCH")
          if [ "$DRY_RUN" = "true" ]; then arguments+=(--dry-run); fi
          result=$(uv run papertrader "${arguments[@]}")
          echo "commit_sha=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["commit_sha"])' <<< "$result")" >> "$GITHUB_OUTPUT"
      - name: Complete an already-finalized cycle when podcast generation is disabled
        if: ${{ steps.cycle.outputs.needs_finalization == 'false' && (!inputs.generate_podcast || inputs.dry_run) }}
        env:
          CYCLE_ID: ${{ steps.cycle.outputs.cycle_id }}
        run: uv run papertrader daily complete --daily-cycle-id "$CYCLE_ID"
      - name: Freeze complete cycle podcast context and enqueue text synthesis
        id: podcast_enqueue
        if: ${{ inputs.generate_podcast && !inputs.dry_run }}
        env:
          CYCLE_ID: ${{ steps.cycle.outputs.cycle_id }}
        run: |
          cutoff=$(python3 -c 'import json,os,pathlib; print(json.loads((pathlib.Path("data/runs") / os.environ["CYCLE_ID"] / "daily_run.json").read_text())["research_cutoff_at"])')
          uv run papertrader podcast context build --daily-cycle-id "$CYCLE_ID" --cutoff "$cutoff"
          uv run papertrader podcast context validate --daily-cycle-id "$CYCLE_ID"
          result=$(uv run papertrader podcast enqueue --run-id "$CYCLE_ID")
          echo "operation_id=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["operation_id"])' <<< "$result")" >> "$GITHUB_OUTPUT"
      - name: Synthesize the transcript and one ephemeral audio draft
        if: ${{ inputs.generate_podcast && !inputs.dry_run }}
        continue-on-error: true
        env:
          CYCLE_ID: ${{ steps.cycle.outputs.cycle_id }}
          PODCAST_OPERATION_ID: ${{ steps.podcast_enqueue.outputs.operation_id }}
          PAPERTRADER_PODCAST_OUTPUT_DIRECTORY: ${{ runner.temp }}/papertrader-podcast/${{ steps.cycle.outputs.cycle_id }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          install -d -o hermes -g hermes -m 700 "$PAPERTRADER_PODCAST_OUTPUT_DIRECTORY"
          uv run papertrader agent run --hermes-home "$HERMES_HOME" --run-id "$CYCLE_ID" --operation-id "$PODCAST_OPERATION_ID" --operation-type daily_podcast
      - name: Encrypt a podcast-time OAuth refresh before its text checkpoint
        if: ${{ inputs.generate_podcast && !inputs.dry_run }}
        env:
          OPENAI_OAUTH_SECRET: ${{ secrets.OPENAI_OAUTH_SECRET }}
        run: |
          auth_before="$RUNNER_TEMP/openai-oauth-auth.before.json"
          auth_file="$HERMES_HOME/auth.json"
          if cmp -s "$auth_before" "$auth_file"; then exit 0; fi
          identity="$RUNNER_TEMP/podcast-oauth.agekey"
          refreshed="$RUNNER_TEMP/podcast-oauth.age"
          verified="$RUNNER_TEMP/podcast-oauth.verify.json"
          install -m 600 /dev/null "$identity"
          printf '%s\n' "$OPENAI_OAUTH_SECRET" > "$identity"
          recipient=$(age-keygen -y "$identity")
          age --encrypt --recipient "$recipient" --output "$refreshed" "$auth_file"
          age --decrypt --identity "$identity" --output "$verified" "$refreshed"
          cmp -s "$auth_file" "$verified"
          install -m 600 "$refreshed" .papertrader/credentials/openai-oauth-auth.json.age
          install -m 600 "$auth_file" "$auth_before"
          rm -f "$identity" "$refreshed" "$verified"
      - name: Finalize text podcast and reserve its checkpoint
        id: podcast_text
        if: ${{ inputs.generate_podcast && !inputs.dry_run }}
        env:
          CYCLE_ID: ${{ steps.cycle.outputs.cycle_id }}
          PODCAST_OPERATION_ID: ${{ steps.podcast_enqueue.outputs.operation_id }}
        run: |
          status=$(uv run papertrader podcast finalize --run-id "$CYCLE_ID")
          profile=$(python3 -c 'import json,os,pathlib; print(json.loads((pathlib.Path("data/runs") / os.environ["CYCLE_ID"] / os.environ["PODCAST_OPERATION_ID"] / "profile_route.json").read_text())["profile"])')
          checkpoint=$(uv run papertrader daily record-checkpoint --daily-cycle-id "$CYCLE_ID" --kind podcast_text --operation-id "$PODCAST_OPERATION_ID" --operation-type daily_podcast --terminal-status "$status" --profile "$profile")
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          echo "index=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["index"])' <<< "$checkpoint")" >> "$GITHUB_OUTPUT"
      - name: Push the terminal text-podcast checkpoint
        id: podcast_checkpoint
        if: ${{ inputs.generate_podcast && !inputs.dry_run && steps.podcast_text.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CYCLE_ID: ${{ steps.cycle.outputs.cycle_id }}
          CHECKPOINT_INDEX: ${{ steps.podcast_text.outputs.index }}
          PODCAST_OPERATION_ID: ${{ steps.podcast_enqueue.outputs.operation_id }}
          TARGET_BRANCH: ${{ inputs.target_branch || github.event.repository.default_branch }}
        run: |
          result=$(uv run papertrader workflow checkpoint --daily-cycle-id "$CYCLE_ID" --checkpoint-index "$CHECKPOINT_INDEX" --kind podcast_text --operation-id "$PODCAST_OPERATION_ID" --operation-type daily_podcast --terminal-status "${{ steps.podcast_text.outputs.status }}" --profile "${{ steps.podcast_text.outputs.profile }}" --target-branch "$TARGET_BRANCH")
          echo "commit_sha=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["commit_sha"])' <<< "$result")" >> "$GITHUB_OUTPUT"
      - name: Seal the existing draft against the exact pushed transcript
        id: seal_audio
        if: ${{ inputs.generate_podcast && !inputs.dry_run && steps.podcast_text.outputs.status == 'succeeded' && steps.podcast_checkpoint.outcome == 'success' }}
        continue-on-error: true
        env:
          CYCLE_ID: ${{ steps.cycle.outputs.cycle_id }}
          SCRIPT_COMMIT: ${{ steps.podcast_checkpoint.outputs.commit_sha }}
        run: |
          command -v ffprobe >/dev/null
          stamp="${CYCLE_ID#daily-}"
          output_directory="$RUNNER_TEMP/papertrader-podcast/$CYCLE_ID"
          script_path="data/wiki/podcasts/daily-podcast_${stamp}.md"
          result=$(uv run papertrader podcast seal-render --daily-cycle-id "$CYCLE_ID" --script-commit "$SCRIPT_COMMIT" --script-path "$script_path" --output-directory "$output_directory")
          echo "audio_path=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["audio_path"])' <<< "$result")" >> "$GITHUB_OUTPUT"
          echo "manifest_path=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["manifest_path"])' <<< "$result")" >> "$GITHUB_OUTPUT"
          echo "script_path=$script_path" >> "$GITHUB_OUTPUT"
      - name: Deliver the exact committed podcast script
        id: deliver_podcast_script
        if: ${{ always() && inputs.send_telegram && inputs.generate_podcast && !inputs.dry_run && steps.podcast_text.outputs.status == 'succeeded' && steps.podcast_checkpoint.outcome == 'success' }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CYCLE_ID: ${{ steps.cycle.outputs.cycle_id }}
          SCRIPT_COMMIT: ${{ steps.podcast_checkpoint.outputs.commit_sha }}
        run: |
          stamp="${CYCLE_ID#daily-}"
          SCRIPT_PATH="data/wiki/podcasts/daily-podcast_${stamp}.md"
          set +e
          result=$(uv run papertrader telegram deliver-podcast-script --commit-sha "$SCRIPT_COMMIT" --script-path "$SCRIPT_PATH" --daily-cycle-id "$CYCLE_ID" --repository-url "https://github.com/${GITHUB_REPOSITORY}")
          result_code=$?
          set -e
          if [ "$result_code" -ne 0 ]; then
            uv run papertrader telegram record-script-failure --daily-cycle-id "$CYCLE_ID" --script-commit "$SCRIPT_COMMIT" --error "committed podcast script delivery validation failed"
            echo "status=failed" >> "$GITHUB_OUTPUT"
          else
            echo "status=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<< "$result")" >> "$GITHUB_OUTPUT"
          fi
      - name: Deliver the independently sealed ephemeral podcast audio
        id: deliver_podcast_audio
        if: ${{ always() && inputs.send_telegram && steps.seal_audio.outcome == 'success' }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CYCLE_ID: ${{ steps.cycle.outputs.cycle_id }}
          SCRIPT_COMMIT: ${{ steps.podcast_checkpoint.outputs.commit_sha }}
          AUDIO_PATH: ${{ steps.seal_audio.outputs.audio_path }}
          AUDIO_MANIFEST_PATH: ${{ steps.seal_audio.outputs.manifest_path }}
        run: |
          set +e
          result=$(uv run papertrader telegram deliver-audio --manifest-path "$AUDIO_MANIFEST_PATH" --audio-path "$AUDIO_PATH" --repository-url "https://github.com/${GITHUB_REPOSITORY}")
          result_code=$?
          set -e
          if [ "$result_code" -ne 0 ]; then
            uv run papertrader telegram record-audio-failure --daily-cycle-id "$CYCLE_ID" --script-commit "$SCRIPT_COMMIT" --error "sealed ephemeral podcast audio delivery validation failed"
            echo "status=failed" >> "$GITHUB_OUTPUT"
          else
            echo "status=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<< "$result")" >> "$GITHUB_OUTPUT"
          fi
      - name: Record an unavailable Hermes audio draft
        id: audio_failure
        if: ${{ always() && inputs.send_telegram && inputs.generate_podcast && !inputs.dry_run && steps.podcast_text.outputs.status == 'succeeded' && steps.podcast_checkpoint.outcome == 'success' && steps.seal_audio.outcome != 'success' }}
        env:
          CYCLE_ID: ${{ steps.cycle.outputs.cycle_id }}
          SCRIPT_COMMIT: ${{ steps.podcast_checkpoint.outputs.commit_sha }}
        run: |
          uv run papertrader telegram record-audio-failure --daily-cycle-id "$CYCLE_ID" --script-commit "$SCRIPT_COMMIT" --error "Hermes draft rendering or committed-script sealing failed"
          echo "status=failed" >> "$GITHUB_OUTPUT"
      - name: Validate podcast delivery issue state
        id: podcast_delivery_state
        if: ${{ always() && inputs.generate_podcast && !inputs.dry_run }}
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add --all -- data
          uv run papertrader runtime-whitelist validate --staged
          uv run papertrader integrity --strict
          uv run papertrader advice validate --strict
          uv run papertrader wiki lint --strict
          uv run papertrader portfolio reconcile --strict
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Commit podcast delivery issue state
        id: podcast_delivery_commit
        if: ${{ always() && steps.podcast_delivery_state.outputs.changed == 'true' }}
        env:
          SCRIPT_COMMIT: ${{ steps.podcast_checkpoint.outputs.commit_sha }}
        run: |
          git config user.name "papertrader-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(delivery): record podcast status ${SCRIPT_COMMIT:0:12}"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Rebase and push podcast delivery issue state
        id: podcast_delivery_push
        if: ${{ always() && steps.podcast_delivery_state.outputs.changed == 'true' }}
        env:
          PAPERTRADER_GIT_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ inputs.target_branch || github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "$TARGET_BRANCH"
          git rebase "origin/${TARGET_BRANCH}"
          uv run papertrader runtime-whitelist validate --base-ref "origin/${TARGET_BRANCH}" --head-ref HEAD
          git config --local credential.helper '!f() { if test "$1" = get; then echo username=x-access-token; echo "password=$PAPERTRADER_GIT_TOKEN"; fi; }; f'
          git push "https://github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${TARGET_BRANCH}"
          git config --local --unset-all credential.helper
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Publish cycle outputs
        id: outputs
        if: ${{ always() }}
        env:
          CYCLE_ID: ${{ steps.cycle.outputs.cycle_id }}
          FINALIZATION_SHA: ${{ steps.finalization_checkpoint.outputs.commit_sha }}
          PODCAST_SHA: ${{ steps.podcast_checkpoint.outputs.commit_sha }}
          PODCAST_DELIVERY_SHA: ${{ steps.podcast_delivery_push.outputs.commit_sha }}
          PODCAST_STATUS: ${{ steps.podcast_text.outputs.status }}
          SEND_TELEGRAM: ${{ inputs.send_telegram }}
          SCRIPT_DELIVERY_STATUS: ${{ steps.deliver_podcast_script.outputs.status }}
          AUDIO_DELIVERY_STATUS: ${{ steps.deliver_podcast_audio.outputs.status || steps.audio_failure.outputs.status }}
        run: |
          manifest="data/runs/$CYCLE_ID/daily_run.json"
          if [ -z "$CYCLE_ID" ] || [ ! -f "$manifest" ]; then
            echo "commit_sha=" >> "$GITHUB_OUTPUT"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "oauth_changed=false" >> "$GITHUB_OUTPUT"
            echo "report_path=" >> "$GITHUB_OUTPUT"
            echo "podcast_status=skipped" >> "$GITHUB_OUTPUT"
            echo "podcast_path=" >> "$GITHUB_OUTPUT"
            echo "podcast_script_delivery_status=skipped" >> "$GITHUB_OUTPUT"
            echo "podcast_audio_delivery_status=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          report_path=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["report_path"])' "$manifest")
          podcast_path=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["podcast_page_path"])' "$manifest")
          echo "commit_sha=${PODCAST_DELIVERY_SHA:-${PODCAST_SHA:-$FINALIZATION_SHA}}" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "oauth_changed=false" >> "$GITHUB_OUTPUT"
          echo "report_path=$report_path" >> "$GITHUB_OUTPUT"
          echo "podcast_status=${PODCAST_STATUS:-skipped}" >> "$GITHUB_OUTPUT"
          echo "podcast_path=$podcast_path" >> "$GITHUB_OUTPUT"
          if [ "$SEND_TELEGRAM" = "true" ]; then
            echo "podcast_script_delivery_status=${SCRIPT_DELIVERY_STATUS:-skipped}" >> "$GITHUB_OUTPUT"
            echo "podcast_audio_delivery_status=${AUDIO_DELIVERY_STATUS:-skipped}" >> "$GITHUB_OUTPUT"
          else
            echo "podcast_script_delivery_status=skipped" >> "$GITHUB_OUTPUT"
            echo "podcast_audio_delivery_status=skipped" >> "$GITHUB_OUTPUT"
          fi
      - name: Remove plaintext OAuth and all temporary media
        if: ${{ always() }}
        run: |
          rm -f "$HERMES_HOME/auth.json" "$RUNNER_TEMP/openai-oauth-auth.before.json" "$RUNNER_TEMP/papertrader-checkpoint.agekey" "$RUNNER_TEMP/openai-oauth-auth.refreshed.age" "$RUNNER_TEMP/openai-oauth-auth.verified.json"
          rm -rf "$RUNNER_TEMP/papertrader-podcast"
