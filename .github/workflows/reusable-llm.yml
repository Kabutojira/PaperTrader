name: Reusable checkpointed PaperTrader daily cycle

on:
  workflow_call:
    inputs:
      operation_id:
        required: false
        default: ""
        type: string
      operation_type:
        required: false
        default: ""
        type: string
      max_operations:
        description: Maximum queued research iterations in this daily cycle
        required: false
        default: "1"
        type: string
      resume_cycle_id:
        description: Optional timestamped cycle to resume
        required: false
        default: ""
        type: string
      dry_run:
        required: false
        default: true
        type: boolean
      generate_podcast:
        required: false
        default: false
        type: boolean
      send_telegram:
        required: false
        default: false
        type: boolean
      wiki_maintenance:
        required: false
        default: false
        type: boolean
      scan_youtube:
        required: false
        default: false
        type: boolean
      scan_seekingalpha:
        required: false
        default: false
        type: boolean
      target_branch:
        required: false
        default: ""
        type: string
      trigger:
        required: false
        default: workflow_dispatch
        type: string
      serialized_by_caller:
        required: false
        default: false
        type: boolean
    secrets:
      OPENAI_OAUTH_SECRET:
        required: false
      OPENROUTER_API_KEY:
        required: false
      YOUTUBE_DATA_API:
        required: false
      TELEGRAM_BOT_TOKEN:
        required: false
      TELEGRAM_CHAT_ID:
        required: false
    outputs:
      commit_sha:
        value: ${{ jobs.runtime.outputs.commit_sha }}
      changed:
        value: ${{ jobs.runtime.outputs.changed }}
      report_path:
        value: ${{ jobs.runtime.outputs.report_path }}
      run_id:
        value: ${{ jobs.runtime.outputs.daily_cycle_id }}
      daily_cycle_id:
        value: ${{ jobs.runtime.outputs.daily_cycle_id }}
      oauth_changed:
        value: ${{ jobs.runtime.outputs.oauth_changed }}
      podcast_status:
        value: ${{ jobs.runtime.outputs.podcast_status }}
      podcast_path:
        value: ${{ jobs.runtime.outputs.podcast_path }}
      podcast_script_delivery_status:
        value: ${{ jobs.runtime.outputs.podcast_script_delivery_status }}
      podcast_audio_delivery_status:
        value: ${{ jobs.runtime.outputs.podcast_audio_delivery_status }}
  workflow_dispatch:
    inputs:
      operation_id:
        required: false
        default: ""
        type: string
      operation_type:
        required: false
        default: ""
        type: string
      max_operations:
        required: false
        default: "1"
        type: string
      resume_cycle_id:
        required: false
        default: ""
        type: string
      dry_run:
        required: false
        default: true
        type: boolean
      generate_podcast:
        required: false
        default: false
        type: boolean
      send_telegram:
        required: false
        default: false
        type: boolean
      wiki_maintenance:
        required: false
        default: false
        type: boolean
      scan_youtube:
        required: false
        default: false
        type: boolean
      scan_seekingalpha:
        required: false
        default: false
        type: boolean
      target_branch:
        required: false
        default: ""
        type: string
      trigger:
        required: false
        default: workflow_dispatch
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ inputs.serialized_by_caller && format('papertrader-runtime-{0}', github.run_id) || 'papertrader-write' }}
  cancel-in-progress: false

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
    container:
      # Hermes Agent v0.18.2 (v2026.7.7.2).
      image: nousresearch/hermes-agent@sha256:9c841866021c54c4596849f6135717e8a4d52ba510b7f52c50aef1de1a283973
      options: --user 0:0
    defaults:
      run:
        shell: bash
    env:
      AUXILIARY_MODEL: ${{ vars.AUXILIARY_MODEL || 'openai-codex:gpt-5.6-terra' }}
      HERMES_HOME: /tmp/papertrader-hermes
      HERMES_SCOUT_MAX_TURNS: ${{ vars.HERMES_SCOUT_MAX_TURNS || '' }}
      HERMES_ANALYST_MAX_TURNS: ${{ vars.HERMES_ANALYST_MAX_TURNS || '' }}
      HERMES_DEEP_MAX_TURNS: ${{ vars.HERMES_DEEP_MAX_TURNS || '' }}
      MAX_OPERATIONS: ${{ inputs.max_operations }}
    outputs:
      commit_sha: ${{ steps.outputs.outputs.commit_sha }}
      changed: ${{ steps.outputs.outputs.changed }}
      report_path: ${{ steps.outputs.outputs.report_path }}
      daily_cycle_id: ${{ steps.cycle.outputs.cycle_id }}
      oauth_changed: ${{ steps.outputs.outputs.oauth_changed }}
      podcast_status: ${{ steps.outputs.outputs.podcast_status }}
      podcast_path: ${{ steps.outputs.outputs.podcast_path }}
      podcast_script_delivery_status: ${{ steps.outputs.outputs.podcast_script_delivery_status }}
      podcast_audio_delivery_status: ${{ steps.outputs.outputs.podcast_audio_delivery_status }}
    steps:
      - name: Check out and fast-forward the target branch without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.target_branch || github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Establish the container workspace boundary
        run: |
          workspace="$(pwd -P)"
          git config --system --add safe.directory "$workspace"
          echo "WIKI_PATH=${workspace}/data/wiki" >> "$GITHUB_ENV"
          git config user.name "papertrader-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Install pinned project runner
        env:
          UV_TOOL_BIN_DIR: /tmp/papertrader-uv/bin
          UV_TOOL_DIR: /tmp/papertrader-uv/tools
        run: |
          uv tool install --no-cache uv==0.8.17
          test "$("$UV_TOOL_BIN_DIR/uv" --version)" = "uv 0.8.17"
          echo "$UV_TOOL_BIN_DIR" >> "$GITHUB_PATH"
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Resolve one resumable daily cycle without mutating state
        id: cycle_resolution
        env:
          RESUME_CYCLE_ID: ${{ inputs.resume_cycle_id }}
          RUN_TRIGGER: ${{ inputs.trigger }}
        run: |
          result=$(uv run papertrader daily resolve-cycle --trigger "$RUN_TRIGGER" --github-run-id "$GITHUB_RUN_ID" --resume-cycle-id "$RESUME_CYCLE_ID")
          cycle_id=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["daily_cycle_id"])' <<< "$result")
          echo "cycle_id=$cycle_id" >> "$GITHUB_OUTPUT"
      - name: Validate the selected cycle limit and run the full preflight gate
        env:
          RESOLVED_CYCLE_ID: ${{ steps.cycle_resolution.outputs.cycle_id }}
        run: |
          case "$MAX_OPERATIONS" in ""|*[!0-9]*) echo "::error::MAX_OPERATIONS must be a positive integer"; exit 1;; esac
          test "$MAX_OPERATIONS" -gt 0
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run pytest
          uv run papertrader schema validate --strict
          integrity_arguments=(integrity --strict)
          if [ -n "$RESOLVED_CYCLE_ID" ]; then
            integrity_arguments+=(--prepared-daily-cycle-id "$RESOLVED_CYCLE_ID")
          fi
          uv run papertrader "${integrity_arguments[@]}"
      - name: Configure isolated Hermes profile
        env:
          OPERATION_TYPE: ${{ inputs.operation_type }}
        run: uv run papertrader agent configure --hermes-home "$HERMES_HOME" --replace-unmanaged --operation-type "${OPERATION_TYPE:-wiki_ingest}"
      - name: Install checksum-verified age 1.3.1
        if: ${{ !inputs.dry_run }}
        run: |
          archive="$RUNNER_TEMP/age-v1.3.1-linux-amd64.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 --output "$archive" "https://github.com/FiloSottile/age/releases/download/v1.3.1/age-v1.3.1-linux-amd64.tar.gz"
          echo "bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377  $archive" | sha256sum --check --status
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          install -m 755 "$RUNNER_TEMP/age/age" /usr/local/bin/age
          install -m 755 "$RUNNER_TEMP/age/age-keygen" /usr/local/bin/age-keygen
          test "$(age --version)" = "v1.3.1"
          test "$(age-keygen --version)" = "v1.3.1"
      - name: Restore OpenAI OAuth only inside Hermes home
        if: ${{ !inputs.dry_run }}
        env:
          OPENAI_OAUTH_SECRET: ${{ secrets.OPENAI_OAUTH_SECRET }}
        run: |
          identity="$RUNNER_TEMP/openai-oauth.agekey"
          install -m 600 /dev/null "$identity"
          printf '%s\n' "$OPENAI_OAUTH_SECRET" > "$identity"
          age --decrypt --identity "$identity" --output "$HERMES_HOME/auth.json" .papertrader/credentials/openai-oauth-auth.json.age
          chmod 600 "$HERMES_HOME/auth.json"
          install -m 600 "$HERMES_HOME/auth.json" "$RUNNER_TEMP/openai-oauth-auth.before.json"
          rm -f "$identity"
      - name: Hand the isolated profile to the Hermes user
        if: ${{ !inputs.dry_run }}
        run: chown -R hermes:hermes "$HERMES_HOME"
      - name: Activate bundled native skills
        if: ${{ !inputs.dry_run }}
        run: hermes skills opt-in --sync
      - name: Preflight OpenAI Codex OAuth without exposing credential state
        if: ${{ !inputs.dry_run }}
        run: |
          if ! oauth_status="$(hermes auth status openai-codex 2>/dev/null)"; then
            unset oauth_status
            echo "::error::OpenAI Codex OAuth preflight failed"
            exit 1
          fi
          oauth_status_line="${oauth_status%%$'\n'*}"
          unset oauth_status
          if [ "$oauth_status_line" != "openai-codex: logged in" ]; then
            unset oauth_status_line
            echo "::error::OpenAI Codex OAuth is unavailable"
            exit 1
          fi
          unset oauth_status_line
      - name: Preflight routed Hermes configuration
        if: ${{ !inputs.dry_run }}
        env:
          OPERATION_TYPE: ${{ inputs.operation_type }}
        run: uv run papertrader agent preflight --hermes-home "$HERMES_HOME" --operation-type "${OPERATION_TYPE:-wiki_ingest}"
      - name: Create or resume one timestamped daily cycle
        id: cycle
        env:
          RESUME_CYCLE_ID: ${{ steps.cycle_resolution.outputs.cycle_id }}
          RUN_TRIGGER: ${{ inputs.trigger }}
        run: |
          source_sha=$(git rev-parse HEAD)
          result=$(uv run papertrader daily resume-or-create --trigger "$RUN_TRIGGER" --source-sha "$source_sha" --github-run-id "$GITHUB_RUN_ID" --workflow-attempt "$GITHUB_RUN_ATTEMPT" --resume-cycle-id "$RESUME_CYCLE_ID")
          cycle_id=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["daily_cycle_id"])' <<< "$result")
          needs_finalization=$(python3 -c 'import json,sys; print("false" if json.load(sys.stdin).get("finalization_at") else "true")' <<< "$result")
          echo "cycle_id=$cycle_id" >> "$GITHUB_OUTPUT"
          echo "needs_finalization=$needs_finalization" >> "$GITHUB_OUTPUT"
      - name: Run weekly native llm-wiki maintenance before queued operations
        if: ${{ steps.cycle.outputs.needs_finalization == 'true' && inputs.wiki_maintenance }}
        env:
          CYCLE_ID: ${{ steps.cycle.outputs.cycle_id }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          arguments=(wiki maintain --run-id "$CYCLE_ID" --hermes-home "$HERMES_HOME")
          if [ "$DRY_RUN" = "true" ]; then arguments+=(--dry-run); fi
          uv run papertrader "${arguments[@]}"
      - name: Discover curated YouTube sources
        if: ${{ steps.cycle.outputs.needs_finalization == 'true' }}
        uses: ./.github/actions/scan-youtube
        env:
          YOUTUBE_DATA_API: ${{ secrets.YOUTUBE_DATA_API }}
        with:
          run_id: ${{ steps.cycle.outputs.cycle_id }}
          enabled: ${{ inputs.scan_youtube }}
          dry_run: ${{ inputs.dry_run }}
      - name: Schedule Seeking Alpha discovery
        if: ${{ steps.cycle.outputs.needs_finalization == 'true' }}
        uses: ./.github/actions/schedule-seekingalpha
        with:
          run_id: ${{ steps.cycle.outputs.cycle_id }}
          enabled: ${{ inputs.scan_seekingalpha }}
          dry_run: ${{ inputs.dry_run }}
      - name: Prepare deterministic daily state and reserve preparation checkpoint
        id: preparation
        if: ${{ steps.cycle.outputs.needs_finalization == 'true' }}
        env:
          CYCLE_ID: ${{ steps.cycle.outputs.cycle_id }}
          RUN_TRIGGER: ${{ inputs.trigger }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          arguments=(daily prepare --run-id "$CYCLE_ID" --trigger "$RUN_TRIGGER" --source-sha "$(git rev-parse HEAD)")
          if [ "$DRY_RUN" = "true" ]; then arguments+=(--offline --skip-classifier); fi
          uv run papertrader "${arguments[@]}"
          checkpoint=$(uv run papertrader daily record-checkpoint --daily-cycle-id "$CYCLE_ID" --kind preparation)
          echo "index=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["index"])' <<< "$checkpoint")" >> "$GITHUB_OUTPUT"
      - name: Push preparation checkpoint from the credentialed boundary
        if: ${{ steps.cycle.outputs.needs_finalization == 'true' }}
        env:
          GITHUB_TOKEN: ${{ !inputs.dry_run && github.token || '' }}
          CYCLE_ID: ${{ steps.cycle.outputs.cycle_id }}
          CHECKPOINT_INDEX: ${{ steps.preparation.outputs.index }}
          TARGET_BRANCH: ${{ inputs.target_branch || github.event.repository.default_branch }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          arguments=(workflow checkpoint --daily-cycle-id "$CYCLE_ID" --checkpoint-index "$CHECKPOINT_INDEX" --kind preparation --target-branch "$TARGET_BRANCH")
          if [ "$DRY_RUN" = "true" ]; then arguments+=(--dry-run); fi
          uv run papertrader "${arguments[@]}"
      - name: Routed research checkpoint 01
        id: operation_01
        if: ${{ steps.cycle.outputs.needs_finalization == 'true' && fromJSON(inputs.max_operations) >= 1 }}
        uses: ./.github/actions/checkpoint-operation
        with:
          daily_cycle_id: ${{ steps.cycle.outputs.cycle_id }}
          hermes_home: ${{ env.HERMES_HOME }}
          operation_id: ${{ inputs.operation_id }}
          operation_type: ${{ inputs.operation_type }}
          target_branch: ${{ inputs.target_branch || github.event.repository.default_branch }}
          dry_run: ${{ inputs.dry_run }}
          github_token: ${{ !inputs.dry_run && github.token || '' }}
          openai_oauth_secret: ${{ secrets.OPENAI_OAUTH_SECRET }}
      - name: Routed research checkpoint 02
        id: operation_02
        if: ${{ steps.cycle.outputs.needs_finalization == 'true' && fromJSON(inputs.max_operations) >= 2 && steps.operation_01.outputs.continue == 'true' }}
        uses: ./.github/actions/checkpoint-operation
        with:
          daily_cycle_id: ${{ steps.cycle.outputs.cycle_id }}
          hermes_home: ${{ env.HERMES_HOME }}
          operation_id: ${{ inputs.operation_id }}
          operation_type: ${{ inputs.operation_type }}
          target_branch: ${{ inputs.target_branch || github.event.repository.default_branch }}
          dry_run: ${{ inputs.dry_run }}
          github_token: ${{ !inputs.dry_run && github.token || '' }}
          openai_oauth_secret: ${{ secrets.OPENAI_OAUTH_SECRET }}
      - name: Routed research checkpoint 03
        id: operation_03
        if: ${{ steps.cycle.outputs.needs_finalization == 'true' && fromJSON(inputs.max_operations) >= 3 && steps.operation_02.outputs.continue == 'true' }}
        uses: ./.github/actions/checkpoint-operation
        with:
          daily_cycle_id: ${{ steps.cycle.outputs.cycle_id }}
          hermes_home: ${{ env.HERMES_HOME }}
          operation_id: ${{ inputs.operation_id }}
          operation_type: ${{ inputs.operation_type }}
          target_branch: ${{ inputs.target_branch || github.event.repository.default_branch }}
          dry_run: ${{ inputs.dry_run }}
          github_token: ${{ !inputs.dry_run && github.token || '' }}
          openai_oauth_secret: ${{ secrets.OPENAI_OAUTH_SECRET }}
      - name: Routed research checkpoint 04
        id: operation_04
        if: ${{ steps.cycle.outputs.needs_finalization == 'true' && fromJSON(inputs.max_operations) >= 4 && steps.operation_03.outputs.continue == 'true' }}
        uses: ./.github/actions/checkpoint-operation
        with:
          daily_cycle_id: ${{ steps.cycle.outputs.cycle_id }}
          hermes_home: ${{ env.HERMES_HOME }}
          operation_id: ${{ inputs.operation_id }}
          operation_type: ${{ inputs.operation_type }}
          target_branch: ${{ inputs.target_branch || github.event.repository.default_branch }}
          dry_run: ${{ inputs.dry_run }}
          github_token: ${{ !inputs.dry_run && github.token || '' }}
          openai_oauth_secret: ${{ secrets.OPENAI_OAUTH_SECRET }}
      - name: Routed research checkpoint 05
        id: operation_05
        if: ${{ steps.cycle.outputs.needs_finalization == 'true' && fromJSON(inputs.max_operations) >= 5 && steps.operation_04.outputs.continue == 'true' }}
        uses: ./.github/actions/checkpoint-operation
        with:
          daily_cycle_id: ${{ steps.cycle.outputs.cycle_id }}
          hermes_home: ${{ env.HERMES_HOME }}
          operation_id: ${{ inputs.operation_id }}
          operation_type: ${{ inputs.operation_type }}
          target_branch: ${{ inputs.target_branch || github.event.repository.default_branch }}
          dry_run: ${{ inputs.dry_run }}
          github_token: ${{ !inputs.dry_run && github.token || '' }}
          openai_oauth_secret: ${{ secrets.OPENAI_OAUTH_SECRET }}
      - name: Routed research checkpoint 06
        id: operation_06
        if: ${{ steps.cycle.outputs.needs_finalization == 'true' && fromJSON(inputs.max_operations) >= 6 && steps.operation_05.outputs.continue == 'true' }}
        uses: ./.github/actions/checkpoint-operation
        with:
          daily_cycle_id: ${{ steps.cycle.outputs.cycle_id }}
          hermes_home: ${{ env.HERMES_HOME }}
          operation_id: ${{ inputs.operation_id }}
          operation_type: ${{ inputs.operation_type }}
          target_branch: ${{ inputs.target_branch || github.event.repository.default_branch }}
          dry_run: ${{ inputs.dry_run }}
          github_token: ${{ !inputs.dry_run && github.token || '' }}
          openai_oauth_secret: ${{ secrets.OPENAI_OAUTH_SECRET }}
      - name: Routed research checkpoint 07
        id: operation_07
        if: ${{ steps.cycle.outputs.needs_finalization == 'true' && fromJSON(inputs.max_operations) >= 7 && steps.operation_06.outputs.continue == 'true' }}
        uses: ./.github/actions/checkpoint-operation
        with:
          daily_cycle_id: ${{ steps.cycle.outputs.cycle_id }}
          hermes_home: ${{ env.HERMES_HOME }}
          operation_id: ${{ inputs.operation_id }}
          operation_type: ${{ inputs.operation_type }}
          target_branch: ${{ inputs.target_branch || github.event.repository.default_branch }}
          dry_run: ${{ inputs.dry_run }}
          github_token: ${{ !inputs.dry_run && github.token || '' }}
          openai_oauth_secret: ${{ secrets.OPENAI_OAUTH_SECRET }}
      - name: Routed research checkpoint 08
        id: operation_08
        if: ${{ steps.cycle.outputs.needs_finalization == 'true' && fromJSON(inputs.max_operations) >= 8 && steps.operation_07.outputs.continue == 'true' }}
        uses: ./.github/actions/checkpoint-operation
        with:
          daily_cycle_id: ${{ steps.cycle.outputs.cycle_id }}
          hermes_home: ${{ env.HERMES_HOME }}
          operation_id: ${{ inputs.operation_id }}
          operation_type: ${{ inputs.operation_type }}
          target_branch: ${{ inputs.target_branch || github.event.repository.default_branch }}
          dry_run: ${{ inputs.dry_run }}
          github_token: ${{ !inputs.dry_run && github.token || '' }}
          openai_oauth_secret: ${{ secrets.OPENAI_OAUTH_SECRET }}
      - name: Routed research checkpoint 09
        id: operation_09
        if: ${{ steps.cycle.outputs.needs_finalization == 'true' && fromJSON(inputs.max_operations) >= 9 && steps.operation_08.outputs.continue == 'true' }}
        uses: ./.github/actions/checkpoint-operation
        with:
          daily_cycle_id: ${{ steps.cycle.outputs.cycle_id }}
          hermes_home: ${{ env.HERMES_HOME }}
          operation_id: ${{ inputs.operation_id }}
          operation_type: ${{ inputs.operation_type }}
          target_branch: ${{ inputs.target_branch || github.event.repository.default_branch }}
          dry_run: ${{ inputs.dry_run }}
          github_token: ${{ !inputs.dry_run && github.token || '' }}
          openai_oauth_secret: ${{ secrets.OPENAI_OAUTH_SECRET }}
      - name: Routed research checkpoint 10
        id: operation_10
        if: ${{ steps.cycle.outputs.needs_finalization == 'true' && fromJSON(inputs.max_operations) >= 10 && steps.operation_09.outputs.continue == 'true' }}
        uses: ./.github/actions/checkpoint-operation
        with:
          daily_cycle_id: ${{ steps.cycle.outputs.cycle_id }}
          hermes_home: ${{ env.HERMES_HOME }}
          operation_id: ${{ inputs.operation_id }}
          operation_type: ${{ inputs.operation_type }}
          target_branch: ${{ inputs.target_branch || github.event.repository.default_branch }}
          dry_run: ${{ inputs.dry_run }}
          github_token: ${{ !inputs.dry_run && github.token || '' }}
          openai_oauth_secret: ${{ secrets.OPENAI_OAUTH_SECRET }}
      - name: Routed research checkpoint 11
        id: operation_11
        if: ${{ steps.cycle.outputs.needs_finalization == 'true' && fromJSON(inputs.max_operations) >= 11 && steps.operation_10.outputs.continue == 'true' }}
        uses: ./.github/actions/checkpoint-operation
        with:
          daily_cycle_id: ${{ steps.cycle.outputs.cycle_id }}
          hermes_home: ${{ env.HERMES_HOME }}
          operation_id: ${{ inputs.operation_id }}
