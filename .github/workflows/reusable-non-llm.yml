name: Reusable deterministic validation gate

on:
  workflow_call:
    inputs:
      dry_run:
        description: Retained for a uniform reusable-workflow interface
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run the deterministic validation gate only
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PAPER_TRADING_ONLY: "true"
      WIKI_PATH: ${{ github.workspace }}/data/wiki
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned project runner
        run: python3 -m pip install --disable-pip-version-check uv==0.8.17
      - name: Install locked Python dependencies
        run: uv sync --locked --all-groups
      - name: Run the complete Python and repository gate
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run papertrader schema validate --strict
          uv run pytest
          uv run papertrader integrity --strict
          uv run papertrader wiki lint --strict
          uv run papertrader portfolio reconcile --strict
      - name: Use pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.4.1"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install locked Quartz dependencies
        run: npm ci --prefix site --ignore-scripts
      - name: Validate the complete seeded publication cycle
        env:
          PAPERTRADER_VALIDATE_QUARTZ: "true"
        run: uv run pytest tests/integration/test_complete_operating_cycle.py
      - name: Check and build the canonical Quartz source
        run: |
          npm run check --prefix site
          npm run build --prefix site
