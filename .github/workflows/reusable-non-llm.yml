name: Reusable deterministic validation

on:
  workflow_call:
    inputs:
      dry_run:
        description: Do not publish or mutate external state
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      dry_run:
        description: Do not publish or mutate external state
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PAPER_TRADING_ONLY: "true"
      WIKI_PATH: ${{ github.workspace }}/data/wiki
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check uv==0.8.17
      - run: uv sync --locked --all-groups
      - run: uv run papertrader integrity --strict
      - run: uv run papertrader wiki lint --strict
      - run: uv run papertrader portfolio reconcile --strict
