name: CI

on:
  push:
    paths-ignore:
      - .papertrader/credentials/openai-oauth-auth.json.age
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PAPER_TRADING_ONLY: "true"
      WIKI_PATH: ${{ github.workspace }}/data/wiki
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned uv bootstrap
        run: python3 -m pip install --disable-pip-version-check uv==0.8.17
      - name: Install locked Python dependencies
        run: uv sync --locked --all-groups
      - name: Lint Python
        run: uv run ruff check .
      - name: Check Python formatting
        run: uv run ruff format --check .
      - name: Type-check Python
        run: uv run mypy src
      - name: Validate schemas
        run: uv run papertrader schema validate --strict
      - name: Run tests
        run: uv run pytest
      - name: Run integrity checks
        run: uv run papertrader integrity --strict
      - name: Validate investor publication snapshot and exports
        run: uv run papertrader advice validate --strict
      - name: Lint wiki
        run: uv run papertrader wiki lint --strict
      - name: Reconcile empty scaffold
        run: uv run papertrader portfolio reconcile --strict
      - name: Use pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.4.1"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install locked Quartz dependencies
        run: npm ci --prefix site --ignore-scripts
      - name: Validate the complete seeded publication cycle
        env:
          PAPERTRADER_VALIDATE_QUARTZ: "true"
        run: uv run pytest tests/integration/test_complete_operating_cycle.py
      - name: Check Quartz source configuration
        run: npm run check --prefix site
      - name: Build the canonical Quartz wiki
        run: npm run build --prefix site
