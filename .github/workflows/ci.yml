name: CI

on:
  push:
    paths-ignore:
      - .papertrader/credentials/openai-oauth-auth.json.age
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WIKI_PATH: ${{ github.workspace }}/data/wiki
      PAPERTRADER_BASE_URL: localhost
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned uv bootstrap
        run: python3 -m pip install --disable-pip-version-check uv==0.8.17
      - name: Install locked Python dependencies
        run: uv sync --locked --all-groups
      - name: Lint Python
        run: uv run ruff check .
      - name: Check Python formatting
        run: uv run ruff format --check .
      - name: Type-check Python
        run: uv run mypy src
      - name: Validate current research schemas and references
        run: uv run papertrader validate
      - name: Run tests
        run: uv run pytest
      - name: Use pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.4.1"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install locked Quartz dependencies
        run: npm ci --prefix site --ignore-scripts
      - name: Check Quartz source configuration
        run: npm run check --prefix site
      - name: Build the canonical Quartz wiki
        run: npm run build --prefix site
